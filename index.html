<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adres Okuma Testi</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f4f4;color:#222}
  header{background:#ffcc00;padding:16px;text-align:center;font-weight:700;font-size:18px}
  main{max-width:520px;margin:auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ikili{display:flex;gap:8px}
  label.btn{flex:1;display:block;text-align:center;background:#1a3a8f;color:#fff;padding:14px 8px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  label.btn.acik{background:#fff;color:#1a3a8f;border:2px solid #1a3a8f}
  input[type=file]{display:none}
  img{max-width:100%;border-radius:8px;margin-top:12px;display:none}
  .bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin-top:10px;display:none}
  .bar div{height:100%;width:0;background:#1a3a8f;transition:width .2s}
  #durum{margin-top:8px;font-size:14px;color:#555}
  h3{margin:0 0 8px;font-size:15px}
  textarea{width:100%;min-height:70px;font-size:15px;padding:10px;border:1px solid #ccc;border-radius:8px;font-family:inherit}
  #ham{min-height:160px;font-size:13px;color:#444}
  .ok{color:#1b7f3a}.no{color:#b3261e}
  button{width:100%;padding:12px;margin-top:8px;border:1px solid #1a3a8f;background:#fff;color:#1a3a8f;border-radius:8px;font-size:15px}
  button.ana{background:#1b7f3a;color:#fff;border:none;font-weight:600}
  .aday{border:1px solid #ddd;border-radius:8px;padding:8px;margin-bottom:8px}
  .aday textarea{min-height:50px}
  .satir{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
  .satir .no-k{background:#1a3a8f;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .mes{color:#555;white-space:nowrap;font-size:13px}
  .sil{width:auto;padding:4px 10px;margin:0;border-color:#b3261e;color:#b3261e}
</style>
</head>
<body>
<header>📦 Adres Okuma Testi</header>
<main>
  <div class="card">
    <div class="ikili">
      <label class="btn" for="kamera">📷 Fotoğraf çek</label>
      <label class="btn acik" for="galeri">🖼️ Ekran görüntüsü / galeri</label>
    </div>
    <input type="file" id="kamera" accept="image/*" capture="environment">
    <input type="file" id="galeri" accept="image/*">
    <img id="onizleme" alt="">
    <div class="bar" id="bar"><div id="dolum"></div></div>
    <div id="durum">Etiket, kağıt liste, terminal ekranı — yazı olan her şeyi okur.</div>
  </div>

  <div class="card">
    <h3>🏠 Bulunan adresler</h3>
    <div id="adaylar"><div style="font-size:13px;color:#777">Fotoğraftan sonra burada görünecek. Düzeltip listeye ekleyebilirsin.</div></div>
  </div>

  <div class="card">
    <h3>📋 Teslimat listesi (<span id="sayi">0</span>)</h3>
    <div id="liste"></div>
    <button class="ana" id="sirala">📍 Konumuma göre sırala (en yakından en uzağa)</button>
    <div id="siraDurum" style="font-size:13px;margin-top:6px;color:#555"></div>
  </div>

  <div class="card">
    <h3>📝 Okunan tüm yazı</h3>
    <textarea id="ham" readonly></textarea>
    <button id="kopyala">Sonucu kopyala (bana gönder)</button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const hataMetni = e => (e && (e.message || e.toString())) || String(e);
let worker = null;
let liste = [];
try { liste = JSON.parse(localStorage.getItem('test_liste') || '[]'); } catch {}
const kaydet = () => { try { localStorage.setItem('test_liste', JSON.stringify(liste)); } catch {} };

async function getWorker(){
  if (worker) return worker;
  $('durum').textContent = 'Türkçe okuma paketi yükleniyor (ilk seferde 10-20 sn sürebilir)…';
  worker = await Tesseract.createWorker('tur', 1, {
    workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    langPath: 'https://tessdata.projectnaptha.com/4.0.0',
    logger: m => {
      if (m.status === 'recognizing text') {
        $('dolum').style.width = Math.round(m.progress * 100) + '%';
        $('durum').textContent = 'Okunuyor… %' + Math.round(m.progress * 100);
      }
    },
    errorHandler: e => { $('durum').textContent = 'Hata: ' + hataMetni(e); }
  });
  return worker;
}

function resimYukle(src){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function dataUrl(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
async function resimAc(file){
  try { if (window.createImageBitmap) return await createImageBitmap(file); } catch {}
  try { return await resimYukle(URL.createObjectURL(file)); } catch {}
  try { return await resimYukle(await dataUrl(file)); } catch {}
  return null;
}
async function hazirla(file){
  const img = await resimAc(file);
  if (!img) return null;
  // Küçük fotoğrafı büyüt, büyüğü küçült (motor ~2000px'te en iyi okur)
  const hedef = 2000, s = Math.min(2.5, hedef / Math.max(img.width, img.height));
  const W = Math.round(img.width * s), H = Math.round(img.height * s);
  const yap = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H); return [c, x]; };
  const [orij] = yap();
  // Gri + kontrast
  const [gri, gx] = yap();
  const d = gx.getImageData(0, 0, W, H), p = d.data, hist = new Array(256).fill(0);
  let toplam = 0;
  for (let i = 0; i < p.length; i += 4) { const g = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2]; toplam += g; }
  const koyu = toplam / (p.length / 4) < 110;
  for (let i = 0; i < p.length; i += 4) {
    let g = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
    if (koyu) g = 255 - g;
    g = Math.max(0, Math.min(255, (g - 128) * 1.5 + 128));
    p[i] = p[i+1] = p[i+2] = g; hist[Math.round(g)]++;
  }
  gx.putImageData(d, 0, 0);
  // Siyah-beyaz (Otsu eşiği)
  const n = p.length / 4; let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sB = 0, wB = 0, enIyi = 0, esik = 128;
  for (let t = 0; t < 256; t++) { wB += hist[t]; if (!wB) continue; const wF = n - wB; if (!wF) break; sB += t * hist[t];
    const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) ** 2; if (v > enIyi) { enIyi = v; esik = t; } }
  const [ikili, ix] = yap(); const d2 = gx.getImageData(0, 0, W, H), q = d2.data;
  for (let i = 0; i < q.length; i += 4) { const v = q[i] > esik ? 255 : 0; q[i] = q[i+1] = q[i+2] = v; }
  ix.putImageData(d2, 0, 0);
  return { orij, gri, ikili };
}

const ADRES = /(adres|mahallesi|sokağı|caddesi|mah\b|mah\.|mahalle|mh\.?\b|sok\b|sk\.?\b|sokak|sokağı|cad\b|cd\.?\b|cadde|bulvar|blv\.?|no\s*[:.]?\s*\d|kat\s*[:.]?\s*\d|daire\b|\bd\s*[:.]\s*\d|apt|apartman|sitesi|blok|bornova|izmir|\b35\d{3}\b)/i;
const MAH = /(mah\b|mah\.|mahalle|mh\.?\b)/i;
const ATLA = /(tel\b|gsm|telefon|\+90|\b0?5\d{2}[\s-]?\d{3}|vergi|e-?posta|@|mersis|ticaret sicil|fatura|iban|web:|www\.)/i;

// --- Okunan yazıyı temizle: güveni düşük kelimeleri ve anlamsız satırları at ---
function anlamli(sat){
  const t = sat.replace(/\s+/g, ' ').trim();
  if (t.length < 3) return false;
  const harf = (t.match(/[0-9A-Za-zÇĞİÖŞÜçğıöşü]/g) || []).length;
  if (harf / t.length < 0.65) return false;                       // çok fazla işaret/çöp
  const kelimeler = t.split(' ');
  const iyi = kelimeler.filter(k => /^[A-Za-zÇĞİÖŞÜçğıöşü]{3,}[.:,]?$/.test(k) || /\d/.test(k)).length;
  return iyi / kelimeler.length >= 0.5;                             // kelimelerin yarısı gerçek kelime/sayı olmalı
}
function temizSatirlar(r){
  const out = [];
  if (r.blocks && r.blocks.length) {
    for (const b of r.blocks) for (const p of (b.paragraphs || [])) for (const l of (p.lines || [])) {
      if (l.confidence < 50) continue;
      const kel = (l.words || []).filter(w => w.confidence >= 45).map(w => w.text);
      const t = (kel.length ? kel.join(' ') : l.text).replace(/[|«»©®_~]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (anlamli(t)) out.push(t);
    }
    return out;
  }
  return r.text.split('\n').map(x => x.replace(/[|«»©®_~]+/g, ' ').replace(/\s+/g, ' ').trim()).filter(anlamli);
}

const ETIKET = /(sayın|sayin|alıcı|alici|gönderen|gonderen|teslim|ad soyad|adı soyadı|müşteri|musteri)\s*:?\s*/i;
const ISIM_DEGIL = /(fatura|tarih|zaman|tutar|toplam|vergi|no\b|tip|şekli|sekli|kdv|iskonto|ödeme|odeme|mal|hizmet|ltd|şti|a\.ş|san\.|tic\.|arşiv|arsiv|kargo|ptt|barkod|adet|desi|tel|e-?posta)/i;
function isimMi(t){
  const x = t.replace(ETIKET, '').trim();
  if (!x || /\d/.test(x) || x.includes(':') || ISIM_DEGIL.test(x) || ADRES.test(x)) return null;
  const k = x.split(' ').filter(Boolean);
  if (k.length < 2 || k.length > 4) return null;
  if (!k.every(w => /^[A-Za-zÇĞİÖŞÜçğıöşü.]{2,}$/.test(w))) return null;
  return x;
}
function adresleriBul(satirlar){
  const sonuc = []; let i = 0;
  while (i < satirlar.length) {
    const s = satirlar[i];
    if (ADRES.test(s) && !ATLA.test(s)) {
      const grup = [s.replace(/^adres\s*:?\s*/i, '')]; let j = i + 1;
      while (j < satirlar.length && j <= i + 3 && ADRES.test(satirlar[j]) && !ATLA.test(satirlar[j]) && !(MAH.test(satirlar[j]) && MAH.test(grup.join(' ')))) { grup.push(satirlar[j]); j++; }
      let adres = grup.join(' ').replace(/\s+/g, ' ').trim();
      const m = adres.match(/^(.*\b(bornova|izmir|antalya|istanbul|ankara|türkiye|\d{5}))\b/i); if (m) adres = m[1];
      if (adres.length > 8 && (MAH.test(adres) || /(sk\b|sok|cad|cd\b|bulv|mahallesi|sokak|caddesi)/i.test(adres))) {
        let isim = '';
        for (let k = i - 1; k >= Math.max(0, i - 3) && !isim; k--) {
          isim = isimMi(satirlar[k]) || '';
          if (!isim && ETIKET.test(satirlar[k]) && satirlar[k + 1] && k + 1 < i) isim = isimMi(satirlar[k + 1]) || '';
        }
        sonuc.push({ isim, adres });
      }
      i = j;
    } else i++;
  }
  return sonuc;
}

function adaylariGoster(adresler, temizMetin){
  const k = $('adaylar'); k.innerHTML = '';
  if (!adresler.length) {
    k.innerHTML = '<div style="font-size:15px;font-weight:600;color:#b3261e;margin-bottom:8px">Burada adres yok.</div>' +
      '<div style="font-size:13px;color:#555;margin-bottom:6px">Yazan yazılar şunlar:</div>' +
      '<div style="font-size:17px;line-height:1.5;white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px"></div>';
    k.lastChild.textContent = temizMetin || '(okunabilir yazı bulunamadı)';
    return;
  }
  adresler.forEach(a => {
    const d = document.createElement('div'); d.className = 'aday';
    d.innerHTML = '<div style="font-size:12px;color:#555">👤 İsim</div><input style="width:100%;font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px;margin-bottom:6px">' +
                  '<div style="font-size:12px;color:#555">🏠 Adres</div><textarea></textarea><button class="ana">➕ Listeye ekle</button>';
    d.querySelector('input').value = a.isim; d.querySelector('input').placeholder = 'İsim bulunamadı';
    d.querySelector('textarea').value = a.adres;
    d.querySelector('button').onclick = () => {
      const v = d.querySelector('textarea').value.trim(); if (!v) return;
      liste.push({ isim: d.querySelector('input').value.trim(), adres: v }); kaydet(); listeyiCiz(); d.remove();
    };
    k.appendChild(d);
  });
}

function listeyiCiz(){
  $('sayi').textContent = liste.length;
  $('liste').innerHTML = liste.map((x, i) =>
    `<div class="satir"><span class="no-k">${i+1}</span><span style="flex:1">${x.isim ? '<b>'+x.isim.replace(/</g,'&lt;')+'</b><br>' : ''}${x.adres.replace(/</g,'&lt;')}</span>` +
    `<span class="mes">${x.mesafe != null ? (x.mesafe < 1 ? Math.round(x.mesafe*1000)+' m' : x.mesafe.toFixed(1)+' km') : (x.bulunamadi ? '❓' : '')}</span>` +
    `<button class="sil" data-i="${i}">Sil</button></div>`).join('') ||
    '<div style="font-size:13px;color:#777">Henüz adres yok.</div>';
  document.querySelectorAll('.sil').forEach(b => b.onclick = () => { liste.splice(+b.dataset.i, 1); kaydet(); listeyiCiz(); });
}

async function oku(e){
  const file = e.target.files[0]; if (!file) return;
  $('onizleme').src = URL.createObjectURL(file); $('onizleme').style.display = 'block';
  $('bar').style.display = 'block'; $('dolum').style.width = '0';
  $('ham').value = ''; $('adaylar').innerHTML = '';
  try {
    if (typeof Tesseract === 'undefined') throw new Error('Okuma motoru indirilemedi (sayfayı yenile)');
    $('durum').textContent = 'Fotoğraf hazırlanıyor… (' + (file.type || 'tür bilinmiyor') + ', ' + Math.round(file.size/1024) + ' KB)';
    let g = null;
    try { g = await hazirla(file); } catch { g = null; }
    const w = await getWorker();
    const t0 = Date.now();
    // Birkaç farklı şekilde oku, en iyisini al
    const denemeler = g
      ? [[g.gri, '3', 'normal'], [g.gri, '4', 'sütun'], [g.orij, '11', 'dağınık yazı'], [g.ikili, '6', 'siyah-beyaz']]
      : [[file, '3', 'ham']];
    let data = null, puanEn = -1; const tumMetinler = [];
    for (let k = 0; k < denemeler.length; k++) {
      const [gorsel, psm] = denemeler[k];
      $('durum').textContent = `Okunuyor… (${k+1}/${denemeler.length})`;
      await w.setParameters({ tessedit_pageseg_mode: psm, preserve_interword_spaces: '1' });
      const r = (await w.recognize(gorsel, {}, { text: true, blocks: true })).data;
      r.temiz = temizSatirlar(r); tumMetinler.push(r.temiz);
      const temiz = r.temiz.join('').replace(/[^0-9A-Za-zÇĞİÖŞÜçğıöşü]/g, '');
      const puan = r.confidence * Math.min(1, temiz.length / 6) + temiz.length * 0.2;
      if (puan > puanEn) { puanEn = puan; data = r; }
    }
    $('ham').value = data.text.trim() || '(hiç yazı bulunamadı)';
    const gorulen = new Set(), adresler = [];
    for (const m of [data.temiz, ...tumMetinler]) for (const a of adresleriBul(m)) {
      const anahtar = a.adres.toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9]/g, '').slice(0, 25);
      if (!gorulen.has(anahtar)) { gorulen.add(anahtar); adresler.push(a); }
    }
    adaylariGoster(adresler, data.temiz.join('\n'));
    $('durum').textContent = `Bitti (${((Date.now()-t0)/1000).toFixed(1)} sn) · ${adresler.length} adres bulundu · güven %${Math.round(data.confidence)}`;
    $('dolum').style.width = '100%';
  } catch (err) {
    $('durum').innerHTML = '<span class="no">Hata: ' + hataMetni(err) + '</span>';
  }
  e.target.value = '';
}
$('kamera').addEventListener('change', oku);
$('galeri').addEventListener('change', oku);

// ---- Sıralama ----
const bekle = ms => new Promise(r => setTimeout(r, ms));
function km(a, b){
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Varsayılan bölge Bornova. Adreste başka ilçe/il yazıyorsa ona göre arar.
const BASKA_YER = /\b(karşıyaka|karsiyaka|bayraklı|bayrakli|konak|buca|çiğli|cigli|gaziemir|karabağlar|karabaglar|narlıdere|balçova|kemalpaşa|kemalpasa|menemen|torbalı|torbali|urla|çeşme|cesme|seferihisar|menderes|aliağa|foça|tire|ödemiş|bergama|dikili|kepez|muratpaşa|konyaaltı|antalya|istanbul|ankara|bursa|manisa|aydın|denizli|muğla)\b/i;
async function koordinat(adres){
  const temiz = adres.replace(/\b(bornova|izmir|İzmir|türkiye|turkiye)\b/gi, '').replace(/\b35\d{3}\b/, '').replace(/[\/]/g, ' ').trim();
  const baskaYer = !/bornova/i.test(adres) && BASKA_YER.test(adres);
  const denemeler = baskaYer ? [adres + ', Türkiye'] : [temiz + ', Bornova, İzmir'];
  const mah = adres.match(/([A-Za-zÇĞİÖŞÜçğıöşü0-9 .]+?)\s*(mah\b|mah\.|mahallesi|mh\.?)/i);
  if (mah) denemeler.push(mah[1].trim() + (baskaYer ? ' Mahallesi, ' + adres.match(BASKA_YER)[1] : ' Mahallesi, Bornova, İzmir'));
  if (!baskaYer) denemeler.push(temiz + ', İzmir');
  for (const q of denemeler) {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tr' + (baskaYer ? '' : '&viewbox=27.15,38.52,27.35,38.40') + '&q=' + encodeURIComponent(q);
    const r = await fetch(url, { headers: { 'Accept-Language': 'tr' } });
    const j = await r.json();
    await bekle(1100);
    if (j[0]) return { lat: +j[0].lat, lon: +j[0].lon };
  }
  return null;
}
$('sirala').onclick = async () => {
  if (!liste.length) { $('siraDurum').textContent = 'Önce listeye adres ekle.'; return; }
  $('siraDurum').textContent = 'Konum alınıyor…';
  let ben;
  try {
    ben = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), rej, { enableHighAccuracy: true, timeout: 15000 }));
  } catch (e) {
    $('siraDurum').innerHTML = '<span class="no">Konum alınamadı: ' + hataMetni(e) + '. Konum iznini aç (sayfa https linkten açılmalı).</span>'; return;
  }
  for (let i = 0; i < liste.length; i++) {
    const x = liste[i];
    if (!x.lat) {
      $('siraDurum').textContent = `Adresler haritada bulunuyor… ${i+1}/${liste.length}`;
      try { const k = await koordinat(x.adres); if (k) { x.lat = k.lat; x.lon = k.lon; x.bulunamadi = false; } else x.bulunamadi = true; }
      catch { x.bulunamadi = true; }
    }
  }
  liste.forEach(x => x.mesafe = x.lat ? km(ben, x) : null);
  liste.sort((a, b) => (a.mesafe ?? 1e9) - (b.mesafe ?? 1e9));
  kaydet(); listeyiCiz();
  const yok = liste.filter(x => x.bulunamadi).length;
  $('siraDurum').innerHTML = '<span class="ok">✔ Sıralandı.</span>' + (yok ? ` ${yok} adres haritada bulunamadı (❓), en sona kondu.` : '');
};

$('kopyala').addEventListener('click', async () => {
  const txt = 'ADRESLER:\n' + [...document.querySelectorAll('#adaylar textarea')].map(t => '- ' + t.value).join('\n') +
              '\n\nHAM YAZI:\n' + $('ham').value + '\n\n' + $('durum').textContent;
  try { await navigator.clipboard.writeText(txt); } catch { $('ham').select(); document.execCommand('copy'); }
  $('kopyala').textContent = 'Kopyalandı ✔';
  setTimeout(() => $('kopyala').textContent = 'Sonucu kopyala (bana gönder)', 2000);
});

listeyiCiz();
</script>
</body>
</html>
